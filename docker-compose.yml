version: '3.8'

services:
  tungtung-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tungtung_restaurant_prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PROJECT_NAME=TungTung restaurant
      - OWNER_EMAIL=nananashop19911@gmail.com
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
